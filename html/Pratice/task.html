<html>

<head>
    <title>Registration Form</title>
</head>

<body>

<form>

    <label>Name</label>
    <input type="text">
    <br><br>

    <label>Content</label>
    <input type="text">


    <br><br>

    <label>Email</label>
    <input type="email">

    <br><br>

    <label>Password</label>
    <input type="password">

    <br><br>

    <label>Age</label>
    <input type="number">

    <br><br>

    <label>Date of Birth</label>
    <input type="date">

    <br><br>

    <label>Gender</label>
    <input type="radio" name="gender"> Male
    <input type="radio" name="gender"> Female
    <input type="radio" name="gender"> Third gender

    <br><br>

    <label>Course</label>
    <select>
        <option>BA</option>
        <option>MA</option>
        <option>PHD</option>
    </select>

    <br><br>

    <label>Skills</label>
    <input type="checkbox"> HTML
    <input type="checkbox"> CSS
    <input type="checkbox"> JavaScript
     <input type="checkbox">Python

    <br><br>

    <label>Address</label>
    <textarea></textarea>

    <br><br>

    <button type="submit">Submit</button>
    <button type="reset">Reset</button>

</form>

</body>

</html>
