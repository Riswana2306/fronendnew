

<!DOCTYPE html>
<html>
<head>
    <title>Form and Table</title>
</head>

<body>

    <h1>Student Form</h1>

    <form>
        <label>Name:</label>
        <input type="text">

        <br><br>

        <label>Email:</label>
        <input type="email">

        <br><br>

        <label>Age:</label>
        <input type="number">

        <br><br>

        <label>Gender:</label>
        <input type="radio" name="gender"> Male
        <input type="radio" name="gender"> Female

        <br><br>

        <label>Subject:</label>
        <select>
            <option>HTML</option>
            <option>CSS</option>
            <option>JavaScript</option>
        </select>

        <br><br>

        <input type="submit" value="Submit">
    </form>

    <hr>

    <h1>Student Table</h1>

    <table border="1" cellpadding="10">
        <tr>
            <th>Name</th>
            <th>Age</th>
            <th>Subject</th>
        </tr>

        <tr>
            <td>Riswana Barvin B</td>
            <td>23</td>
            <td>HTML</td>
        </tr>

        <tr>
            <td>Mohamed Safrosh Khan B</td>
            <td>21</td>
            <td>CSS</td>
        </tr>

        <tr>
            <td>Afrin Banu B</td>
            <td>18</td>
            <td>JavaScript</td>
        </tr>
    </table>

</body>
</html>
