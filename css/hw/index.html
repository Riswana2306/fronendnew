<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Swiggy</title>
    <link rel="stylesheet" href="style.css">
    <link rel="shortcut icon" href="../assets/image/swiggy.jpeg" type="image/x-icon">
</head>

<body>

<header>
    <nav>
        <div class="logo">
            <img src="../assets/image/swiggy.jpeg" alt="Swiggy">
        </div>

        <div class="links">
            <a href="#">Swiggy Corporate</a>
            <a href="#">Partner with us</a>
            <button>Get the App </button>
            <button class="sign in">Sign in</button>
        </div>
    </nav>
</header>

<main>

    <h1>
        Order food & groceries. Discover<br>
        best restaurants. Swiggy it!
    </h1>

    <div class="search-area">

        <div class="location">
            
            <input type="text" placeholder="Enter your delivery location">
        
        </div>

        <div class="search">
            <input type="text" placeholder="Search for restaurant, item or more">
            <span></span>
        </div>

    </div>

    <div class="cards">

        <div class="card">
            <h2>FOOD DELIVERY</h2>
            <p>FROM RESTAURANTS</p>
            <small>UPTO 60% OFF</small>
            <img src="../assets/image/1.avif" alt="Food">
            <button>→</button>
        </div>

        <div class="card">
            <h2>INSTAMART</h2>
            <p>INSTANT GROCERY</p>
            <small>UPTO 60% OFF</small>
            <img src="../assets/image/2.avif" alt="Grocery">
            <button>→</button>
        </div>

        <div class="card">
            <h2>DINEOUT</h2>
            <p>EAT OUT & SAVE MORE</p>
            <small>UPTO 50% OFF</small>
            <img src="../assets/image/3.avif" alt="Dineout">
            <button>→</button>
        </div>

    </div>

</main>

</body>
</html>
