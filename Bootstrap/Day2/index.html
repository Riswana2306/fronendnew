<!DOCTYPE html>
<html>
<head>
    <title>TechNova Solutions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>

<header>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="#">TechNova</a>
            <div>
                <a class="text-white me-3" href="#">Home</a>
                <a class="text-white me-3" href="#">Services</a>
                <a class="text-white" href="#">Contact</a>
            </div>
        </div>
    </nav>
</header>

<main>


<section>
    <div id="demo" class="carousel slide" data-bs-ride="carousel">

        <div class="carousel-inner">
            <div class="carousel-item active">
                <img src="../assets/logo/smarther-logo-2.webp" class="d-block w-100">
            </div>

            <div class="carousel-item">
                <img src="../assets/logo/smarther-logo-2.webp" class="d-block w-100">
            </div>
        </div>

        <button class="carousel-control-prev"
                data-bs-target="#demo" data-bs-slide="prev">
            <span class="carousel-control-prev-icon"></span>
        </button>

        <button class="carousel-control-next"
                data-bs-target="#demo" data-bs-slide="next">
            <span class="carousel-control-next-icon"></span>
        </button>

    </div>
</section>

<section class="container my-4">
    <h2>Contact Us</h2>

    <form>
        <input class="form-control mb-2" type="text" placeholder="Name">
        <input class="form-control mb-2" type="email" placeholder="Email">
        <textarea class="form-control mb-2" placeholder="Message"></textarea>
        <button class="btn btn-primary">Submit</button>
    </form>
</section>

</main>

<footer class="bg-dark text-white text-center p-3">
    © 2026 TechNova Solutions
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
